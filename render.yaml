# Render Blueprint for the public demo: API + worker in one free web service (PROCESS_ROLE=all).
# Secrets are entered in the Render dashboard (sync: false). See docs/DEPLOY.md.
services:
  - type: web
    name: invoice-inbox-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./apps/backend/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: PROCESS_ROLE
        value: all
      - key: MIGRATE_ON_START
        value: 'true'
      - key: WORKER_CONCURRENCY
        value: '1'
      - key: LLM_DRIVER
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-flash-latest
      - key: GEMINI_FALLBACK_MODELS
        value: gemini-flash-lite-latest
      - key: STORAGE_DRIVER
        value: s3
      - key: S3_BUCKET
        value: invoices
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: ACCESS_CODE
        sync: false
      - key: CORS_ORIGIN
        sync: false
