# Serves the SPA and proxies the API on the same origin (no CORS; WebSocket included).
server {
  listen 80;
  # Resolve "api" through Docker's DNS on every request (cached 10s), not once at startup:
  # a rebuilt api container gets a new IP, and a startup-time lookup would keep the old one.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api http://api:3000;
  root /usr/share/nginx/html;
  client_max_body_size 25m;

  location /graphql {
    proxy_pass $api;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 1h;
  }

  location ~ ^/(api|mcp) {
    proxy_pass $api;
    proxy_set_header Host $host;
    proxy_read_timeout 5m;
  }

  location / {
    try_files $uri /index.html;
  }
}
